services:
  web:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000

  bot:
    build: .
    network_mode: host
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: python -m bot.polling
